<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspirations of Dance Awards</title>
  <link rel="stylesheet" href="leaderboard.css" />
</head>
<body class="leaderboard-page" data-awards-mode="published">
  <div class="page-shell awards-shell">
    <header class="masthead">
      <div class="logo-left">
        <img src="img/Logo1.png" alt="Inspirations of Dance logo" />
      </div>

      <div class="title-area">
        <h1 id="eventTitle">Published Awards</h1>
        <div id="lastUpdate" class="updated">Last updated:</div>
      </div>

      <div class="nav-area">
        <div class="top-bar">
          <div class="tab-row">
            <a href="sessions.html" class="tab-btn">🏆 Sessions</a>
            <button class="tab-btn active" type="button">⭐ Awards</button>
          </div>

          <div class="action-row">
            <a id="leaderboardLink" href="leaderboard.html" class="back-btn">Leaderboard</a>
            <a id="resultsLink" href="index.html" class="back-btn">Back to Results</a>
          </div>
        </div>
      </div>
    </header>

    <section class="board-panel awards-panel">
      <article id="publishedAwardsCard" class="award-list-card" hidden>
        <div class="award-list-head">
          <h2>Published Awards / Finals</h2>
          <div class="award-list-subtitle">Loaded from data/published_awards.json</div>
        </div>
        <div id="publishedAwardsSections" class="award-list-sections"></div>
      </article>
    </section>
  </div>

  <script src="js/awards.js"></script>
</body>
</html>
